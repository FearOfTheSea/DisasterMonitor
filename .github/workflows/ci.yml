name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: latest
      - run: uv sync --project apps/api --frozen
      - run: uv run --directory apps/api ruff format --check src tests
      - run: uv run --directory apps/api ruff check src tests
      - run: uv run --directory apps/api mypy
      - run: uv run --directory apps/api pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run format:check
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify migration sources are not tracked
        shell: bash
        run: test -z "$(git ls-files .migration-sources)"

  system:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: latest
      - run: uv sync --project apps/api --frozen
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:system
        working-directory: apps/web
