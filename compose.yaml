services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: disastermonitor
      POSTGRES_USER: disastermonitor
      POSTGRES_PASSWORD: disastermonitor-local-only
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U disastermonitor -d disastermonitor",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - operational-backups:/backups

  migrate:
    build:
      context: ./apps/api
    command:
      - python
      - -m
      - disaster_monitor.infrastructure.operations.runtime
      - migrate
    environment:
      OPERATIONAL_DATABASE_URL: postgresql://disastermonitor:disastermonitor-local-only@postgres:5432/disastermonitor
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
    env_file:
      - path: ./apps/api/.env
        required: false
    environment:
      ALLOWED_ORIGINS: http://localhost:3000
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:4b-instruct-2507-q4_K_M
      OPERATIONAL_DATABASE_URL: postgresql://disastermonitor:disastermonitor-local-only@postgres:5432/disastermonitor
      OPERATIONAL_BLOB_ROOT: /var/lib/disaster-monitor/blobs
      OPERATIONAL_AUTO_MIGRATE: "false"
      COUNTRY_CATALOG_ROOT: /var/lib/disaster-monitor/geography
      COUNTRY_CATALOG_AUTOMATIC_UPDATES: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - operational-blobs:/var/lib/disaster-monitor/blobs
      - country-catalog-data:/var/lib/disaster-monitor/geography
    ports:
      - "8001:8001"

  scheduler:
    build:
      context: ./apps/api
    command:
      - python
      - -m
      - disaster_monitor.infrastructure.operations.runtime
      - scheduler
    environment:
      OPERATIONAL_DATABASE_URL: postgresql://disastermonitor:disastermonitor-local-only@postgres:5432/disastermonitor
      COUNTRY_CATALOG_ROOT: /var/lib/disaster-monitor/geography
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - country-catalog-data:/var/lib/disaster-monitor/geography

  worker:
    build:
      context: ./apps/api
    env_file:
      - path: ./apps/api/.env
        required: false
    command:
      - python
      - -m
      - disaster_monitor.infrastructure.operations.runtime
      - worker
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OPERATIONAL_DATABASE_URL: postgresql://disastermonitor:disastermonitor-local-only@postgres:5432/disastermonitor
      OPERATIONAL_BLOB_ROOT: /var/lib/disaster-monitor/blobs
      COUNTRY_CATALOG_ROOT: /var/lib/disaster-monitor/geography
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - operational-blobs:/var/lib/disaster-monitor/blobs
      - country-catalog-data:/var/lib/disaster-monitor/geography

  backup-tool:
    image: alpine:3.22
    profiles: ["tools"]
    volumes:
      - operational-blobs:/blobs
      - operational-backups:/backups

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8001/api/v1
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8001/api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  operational-blobs:
  operational-backups:
  country-catalog-data:
